<?xml version="1.0"?>
<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
 <defs>
  <!-- 清凉背景渐变 -->
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" stop-color="#0284C7"/>
   <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>
  <!-- 冰晶音符半透明玻璃渐变 -->
  <linearGradient id="iceNoteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
   <stop offset="35%" stop-color="#E0F2FE" stop-opacity="0.45"/>
   <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.2"/>
  </linearGradient>
  <!-- 冰晶外描边渐变 -->
  <linearGradient id="iceStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
   <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.6"/>
   <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
  </linearGradient>
  <!-- 背景微风流线渐变 -->
  <linearGradient id="breezeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
   <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
   <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.75"/>
   <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <!-- 内部冰晶脊线高光 -->
  <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
   <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
   <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
 </defs>
 <!-- App 图标底板 -->
 <!-- 背景微风流线（全部置于音符后方，避免切断主体） -->
 <!-- 主体：完整未被分割的冰晶音符 -->
 <g class="layer">
  <title>Layer 1</title>
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" id="svg_1"/>
  <g opacity="0.65" id="svg_2">
   <path d="m30,110c150,-50 300,40 450,-30" fill="none" stroke="url(#breezeGrad)" stroke-width="7" stroke-linecap="round" id="svg_3"/>
   <path d="m30,250c130,-70 290,50 450,-30" fill="none" stroke="url(#breezeGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8" id="svg_4"/>
   <path d="m30,410c140,-70 300,30 450,-50" fill="none" stroke="url(#breezeGrad)" stroke-width="7" stroke-linecap="round" id="svg_5"/>
  </g>
  <g id="svg_6" transform="matrix(1 0 0 1 55 0)">
   <!-- 冰晶音符底阴影 -->
   <path d="m210,330c0,38 -36,65 -80,65c-44,0 -75,-27 -75,-65c0,-38 31,-65 75,-65c20,0 40,8 54,21l0,-146c0,-15 12,-25 26,-25c50,0 110,30 140,80c10,17 5,30 -12,25c-33,-10 -78,-25 -102,-10l0,120c-13,-5 -26,-5 -26,0z" fill="#0284C7" opacity="0.3" transform="translate(0, 10)" id="svg_7"/>
   <!-- 冰晶音符半透明玻璃体 -->
   <path d="m210,330c0,38 -36,65 -80,65c-44,0 -75,-27 -75,-65c0,-38 31,-65 75,-65c20,0 40,8 54,21l0,-146c0,-15 12,-25 26,-25c50,0 110,30 140,80c10,17 5,30 -12,25c-33,-10 -78,-25 -102,-10l0,120c-13,-5 -26,-5 -26,0z" fill="url(#iceNoteGrad)" stroke="url(#iceStrokeGrad)" stroke-width="3.5" stroke-linejoin="round" id="svg_8"/>
   <!-- 冰晶内部高光细节 -->
   <line x1="200" y1="135" x2="200" y2="305" stroke="url(#highlight)" stroke-width="4" stroke-linecap="round" id="svg_9"/>
   <path d="m85,330c0,-25 20,-45 50,-45" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" id="svg_11"/>
  </g>
 </g>
</svg>