[package]
name = "fika-music"
version = "0.2.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.96.1"
default-run = "fika-music"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fika_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
lofty = "0.24.0"
walkdir = "2.5.0"
notify = "8.2.0"
thiserror = "2.0.18"
rfd = "0.17.2"
oxc_allocator = "0.138.0"
oxc_ast = "0.138.0"
oxc_ast_visit = "0.138.0"
oxc_parser = "0.138.0"
oxc_span = "0.138.0"
reqwest = { version = "0.13.4", features = ["blocking", "json", "query"] }
rquickjs = "0.12.1"
url = "2.5.7"
percent-encoding = "2.3.2"
sha2 = "0.10.9"
md5 = "0.7.0"
semver = "1.0"
base64 = "0.22.1"
flate2 = "1.1.5"
quick-xml = "0.41.0"
aes = "0.8.4"
cbc = "0.1.2"
cipher = { version = "0.4.4", features = ["alloc", "block-padding"] }
ecb = "0.1.2"
netease-music = "=0.1.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8.7"
rsa = "0.9.8"
uuid = { version = "1.18.1", features = ["v4"] }
moka = { version = "0.12.15", features = ["sync"] }
rusqlite_migration = "2.6.0"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
strsim = "0.11.1"
nucleo-matcher = "0.3.1"
natord = "1.0.9"
pinyin = "0.11.0"
rayon = "1.10.0"
regex = "1.12.4"
unicode-normalization = "0.1.25"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
tempfile = "3.27.0"
smallvec = "1.15.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

