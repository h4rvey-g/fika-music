[package]
name = "fika-music"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fika_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
lofty = "0.24.0"
walkdir = "2.5.0"
thiserror = "2.0.18"
rfd = "0.17.2"
mime_guess = "2.0.5"
oxc_allocator = "0.138.0"
oxc_parser = "0.138.0"
oxc_span = "0.138.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
sha2 = "0.10.9"
semver = "1.0"
base64 = "0.22.1"
keyring = { version = "=3.6.3", default-features = false }
netease-music = "=0.1.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

